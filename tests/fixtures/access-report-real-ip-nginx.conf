worker_processes 1;
error_log /tmp/tms-os-access-report-nginx-error.log notice;
pid /tmp/tms-os-access-report-nginx.pid;

events { worker_connections 32; }

http {
    # TMS OS access-report real-ip begin
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    # TMS OS access-report real-ip end
    # TMS OS access-report format begin
    map $realip_remote_addr $tms_from_cloudflared {
        127.0.0.1 1;
        ::1 1;
        default 0;
    }
    map "$tms_from_cloudflared:$http_cf_connecting_ip:$http_x_forwarded_for" $tms_access_client {
        ~^1:(?<tms_cf_ip>[0-9][0-9]?\.[0-9][0-9]?\.[0-9][0-9]?\.[0-9][0-9]?|[0-9A-Fa-f:]+): $tms_cf_ip;
        ~^1::(?<tms_fallback_ip>[^,\s]+)(?:\s*,|\s*$) $tms_fallback_ip;
        default $remote_addr;
    }
    log_format tms_access '$tms_access_client - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    server {
        listen 127.0.0.1:18999;
        access_log /tmp/tms-os-access-report-nginx-access.log tms_access;
        location / { return 204; }
    }
}
