name: Release TMS OS V17.1.2

on:
  push:
    branches: [main]
    paths:
      - 'tests/build_v17_1_2_payload.sh'
      - 'tests/v17_1_2_update_payload_test.php'
      - 'tests/terminal_custom_command_test.php'
      - 'tests/auto_backup_service_test.php'
      - '.github/workflows/release-v17.1.2.yml'
      - 'app/Services/TerminalService.php'
      - 'app/Controllers/TerminalController.php'
      - 'app/Services/AutoBackupService.php'
      - 'app/Controllers/BackupController.php'
      - 'app/Services/PluginService.php'
      - 'app/Views/terminal/index.php'
      - 'app/Views/backups/index.php'
      - 'app/Views/monitoring/index.php'
      - 'app/Views/files/index.php'
      - 'routes/web.php'
      - 'config/app.php'
      - 'public/service-worker.js'

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish V17.1.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, curl

      - name: Verify source
        run: |
          set -Eeuo pipefail
          grep -F "'build' => 'Platform V17.1.2'" config/app.php
          grep -F "'channel' => 'stable'" config/app.php
          grep -F "const VERSION='tms-os-v17.1.2';" public/service-worker.js
          php tests/update_channels_release_test.php
          php tests/update_center_ui_test.php
          php tests/terminal_custom_command_test.php
          php tests/auto_backup_service_test.php
          php tests/telegram_command_service_test.php
          php -l app/Services/TerminalService.php
          php -l app/Controllers/TerminalController.php
          php -l app/Services/AutoBackupService.php
          php -l app/Controllers/BackupController.php
          php -l app/Services/PluginService.php

      - name: Build and test payload
        run: |
          set -Eeuo pipefail
          bash tests/build_v17_1_2_payload.sh
          php tests/v17_1_2_update_payload_test.php

      - name: Finalize release metadata
        run: |
          set -Eeuo pipefail
          cp .build/v17.1.2/release/RELEASE.json RELEASE.json
          php scripts/generate-changelog.php .build/v17.1.2/release/RELEASE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize V17.1.2 release metadata'
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view v17.1.2 >/dev/null 2>&1; then exit 0; fi
          git tag -a v17.1.2 -m 'TMS OS V17.1.2'
          git push origin v17.1.2
          cat > .build/v17.1.2/release/NOTES.md <<'EOF'
          TMS OS V17.1.2 — Terminal thủ công, gói rclone và sửa luồng Backup offsite

          ## Thay đổi
          - Terminal: thêm mục Lệnh thủ công cho quản trị viên — chạy lệnh bash trong thư mục home, timeout 60 giây, output tối đa 100KB, ghi nhật ký kiểm toán; lệnh chẩn đoán preset giữ nguyên.
          - Runtime Packages: thêm gói rclone để cài một chạm, phục vụ Backup offsite lên Google Drive.
          - Backup tự động & Offsite: chưa cài rclone hoặc chưa nhập remote không còn chặn lưu cấu hình — backup nội bộ vẫn chạy bình thường; thêm chú thích cách điền rclone remote và nút Kiểm tra kết nối rclone.
          - File Manager: nút vào Thùng rác có thêm chữ "Thùng rác" cho dễ nhận biết.
          - Resource Monitor: gộp hai hàng "Pin" bị trùng thành một hàng duy nhất (thanh % + trạng thái).
          EOF
          gh release create v17.1.2 \
            .build/v17.1.2/release/TMS_OS_LATEST.zip \
            .build/v17.1.2/release/RELEASE.json \
            --title 'TMS OS V17.1.2' \
            --notes-file .build/v17.1.2/release/NOTES.md \
            --latest
